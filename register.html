<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MineHost — Register</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050807;
    --panel:#0c120e;
    --border:#203126;
    --green:#39ff88;
    --green2:#16c967;
    --text:#f2fff6;
    --muted:#82948a;
    --red:#ff6262;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 0%,rgba(57,255,136,.13),transparent 35%),
        #050807;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
    font-size:25px;
    font-weight:900;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--green),var(--green2));
    color:#031108;
    box-shadow:0 0 30px rgba(57,255,136,.22);
}

.logo span{
    color:var(--green);
}

.card{
    padding:32px;
    background:linear-gradient(145deg,#0d1510,#090e0b);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.card h1{
    text-align:center;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    margin-bottom:28px;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:12px;
    color:#b9c8bf;
    font-weight:700;
}

input{
    width:100%;
    height:48px;
    border:1px solid var(--border);
    outline:none;
    border-radius:11px;
    padding:0 14px;
    background:#070c09;
    color:white;
    font-size:14px;
    transition:.2s;
}

input:focus{
    border-color:rgba(57,255,136,.6);
    box-shadow:0 0 0 3px rgba(57,255,136,.06);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:55px;
}

.show{
    position:absolute;
    right:7px;
    top:7px;
    height:34px;
    padding:0 9px;
    border:0;
    border-radius:8px;
    background:#111a14;
    color:#91a198;
    cursor:pointer;
}

.show:hover{
    color:var(--green);
}

.submit{
    width:100%;
    height:50px;
    border:0;
    border-radius:11px;
    margin-top:6px;
    background:linear-gradient(135deg,var(--green),var(--green2));
    color:#031108;
    font-weight:900;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

.submit:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(57,255,136,.18);
}

.submit:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:12px;
    line-height:1.5;
}

.success{
    display:block;
    color:var(--green);
    background:rgba(57,255,136,.07);
    border:1px solid rgba(57,255,136,.18);
}

.error{
    display:block;
    color:var(--red);
    background:rgba(255,98,98,.07);
    border:1px solid rgba(255,98,98,.18);
}

.login{
    text-align:center;
    margin-top:22px;
    color:var(--muted);
    font-size:13px;
}

.login a{
    color:var(--green);
    text-decoration:none;
    font-weight:800;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#66766c;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:white;
}

@media(max-width:450px){
    .card{
        padding:25px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-box">⛏</div>
        Mine<span>Host</span>
    </div>

    <div class="card">

        <h1>Create account</h1>

        <p class="subtitle">
            MineHost'da bepul akkaunt yarating
            va Minecraft serveringizni boshqaring.
        </p>

        <form id="registerForm">

            <div class="field">
                <label for="username">USERNAME</label>

                <input
                    id="username"
                    type="text"
                    placeholder="MinecraftPlayer"
                    minlength="3"
                    maxlength="20"
                    required
                >
            </div>

            <div class="field">
                <label for="email">EMAIL</label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">

                <label for="password">PASSWORD</label>

                <div class="password-wrap">

                    <input
                        id="password"
                        type="password"
                        placeholder="Kamida 6 ta belgi"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show"
                        data-target="password"
                    >👁</button>

                </div>

            </div>

            <div class="field">

                <label for="confirmPassword">
                    CONFIRM PASSWORD
                </label>

                <div class="password-wrap">

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Parolni qayta kiriting"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show"
                        data-target="confirmPassword"
                    >👁</button>

                </div>

            </div>

            <button
                id="submitButton"
                class="submit"
                type="submit"
            >
                CREATE ACCOUNT
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="login">
            Akkauntingiz bormi?
            <a href="login.html">Login</a>
        </div>

    </div>

    <a href="index.html" class="back">
        ← Bosh sahifaga qaytish
    </a>

</div>

<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   MINEHOST SUPABASE
========================= */

const SUPABASE_URL =
    "https://khyddtvdbapcovdddrbs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Ss52VEnVK_Zk05A6T7PpcQ_fsj_DbJt";

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById("registerForm");

const username =
    document.getElementById("username");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const message =
    document.getElementById("message");

const submitButton =
    document.getElementById("submitButton");


/* =========================
   PASSWORD SHOW/HIDE
========================= */

document
.querySelectorAll(".show")
.forEach(button => {

    button.addEventListener("click", () => {

        const input =
            document.getElementById(
                button.dataset.target
            );

        if(input.type === "password"){

            input.type = "text";
            button.textContent = "🙈";

        }else{

            input.type = "password";
            button.textContent = "👁";

        }

    });

});


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =========================
   REGISTER
========================= */

form.addEventListener("submit", async event => {

    event.preventDefault();

    const user =
        username.value.trim();

    const mail =
        email.value.trim();

    const pass =
        password.value;

    const confirm =
        confirmPassword.value;


    if(user.length < 3){

        showMessage(
            "Username kamida 3 ta belgidan iborat bo‘lishi kerak.",
            "error"
        );

        return;
    }


    if(pass.length < 6){

        showMessage(
            "Parol kamida 6 ta belgidan iborat bo‘lishi kerak.",
            "error"
        );

        return;
    }


    if(pass !== confirm){

        showMessage(
            "Parollar bir xil emas.",
            "error"
        );

        return;
    }


    submitButton.disabled = true;

    submitButton.textContent =
        "CREATING ACCOUNT...";


    try{

        const {
            data,
            error
        } = await supabase.auth.signUp({

            email: mail,

            password: pass,

            options: {

                data: {
                    username: user
                }

            }

        });


        if(error){

            throw error;

        }


        /*
         * Supabase Email Confirmation
         */

        showMessage(
            "Akkaunt yaratildi! Emailingizni tekshiring va tasdiqlang.",
            "success"
        );

        form.reset();


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Ro‘yxatdan o‘tishda xatolik yuz berdi.",
            "error"
        );

    }finally{

        submitButton.disabled = false;

        submitButton.textContent =
            "CREATE ACCOUNT";

    }

});

</script>

</body>
  </html>
