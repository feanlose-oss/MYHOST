<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MineHost — Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050807;
    --panel:#0c120e;
    --border:#203126;
    --green:#39ff88;
    --green2:#16c967;
    --text:#f2fff6;
    --muted:#82948a;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 0%,rgba(57,255,136,.13),transparent 35%),
        #050807;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
    font-size:25px;
    font-weight:900;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--green),var(--green2));
    color:#031108;
    box-shadow:0 0 30px rgba(57,255,136,.22);
}

.logo span{
    color:var(--green);
}

.card{
    padding:32px;
    background:linear-gradient(145deg,#0d1510,#090e0b);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.card h1{
    text-align:center;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    margin-bottom:28px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:12px;
    color:#b9c8bf;
    font-weight:700;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:48px;
    border:1px solid var(--border);
    outline:none;
    border-radius:11px;
    padding:0 14px;
    background:#070c09;
    color:white;
    font-size:14px;
    transition:.2s;
}

input:focus{
    border-color:rgba(57,255,136,.6);
    box-shadow:0 0 0 3px rgba(57,255,136,.06);
}

.password-btn{
    position:absolute;
    right:8px;
    top:7px;
    height:34px;
    padding:0 9px;
    border:0;
    border-radius:8px;
    background:#111a14;
    color:#91a198;
    cursor:pointer;
}

.password-btn:hover{
    color:var(--green);
}

.submit{
    width:100%;
    height:50px;
    border:0;
    border-radius:11px;
    margin-top:5px;
    background:linear-gradient(135deg,var(--green),var(--green2));
    color:#031108;
    font-weight:900;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

.submit:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(57,255,136,.18);
}

.message{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:10px;
    background:rgba(57,255,136,.07);
    border:1px solid rgba(57,255,136,.18);
    color:var(--green);
    text-align:center;
    font-size:12px;
}

.register{
    text-align:center;
    margin-top:22px;
    color:var(--muted);
    font-size:13px;
}

.register a{
    color:var(--green);
    text-decoration:none;
    font-weight:800;
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#66766c;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:white;
}

@media(max-width:450px){
    .card{
        padding:25px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-box">⛏</div>
        Mine<span>Host</span>
    </div>

    <div class="card">

        <h1>Welcome back</h1>

        <p class="subtitle">
            MineHost akkauntingizga kiring
            va serverlaringizni boshqaring.
        </p>

        <form id="loginForm">

            <div class="field">
                <label for="email">EMAIL</label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">

                <label for="password">PASSWORD</label>

                <div class="input-wrap">

                    <input
                        id="password"
                        type="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-btn"
                        id="showPassword"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="submit"
            >
                LOGIN
            </button>

            <div
                class="message"
                id="message"
            ></div>

        </form>

        <div class="register">
            Akkauntingiz yo‘qmi?
            <a href="register.html">Register</a>
        </div>

    </div>

    <a
        href="index.html"
        class="back"
    >
        ← Bosh sahifaga qaytish
    </a>

</div>

<script>

const password =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const form =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


showPassword.addEventListener("click", () => {

    if(password.type === "password"){

        password.type = "text";
        showPassword.textContent = "🙈";

    }else{

        password.type = "password";
        showPassword.textContent = "👁";

    }

});


form.addEventListener("submit", (event) => {

    event.preventDefault();

    message.style.display = "block";

    message.textContent =
        "Login tizimi keyingi bosqichda ulanadi.";

});

</script>

</body>
</html>
